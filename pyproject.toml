[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "oi-harness"
version = "1.0.1"
description = "Agent runtime for Oi: the LangGraph harness, plugin system, built-in tools, skill packages, workspace backends and ACP support."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7,<0.8",
    "httpx>=0.27",
    "langchain-anthropic>=1.5.4,<2.0",
    "langchain-core>=1.5.0,<2.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.2.2,<2.0",
    "langchain>=1.3.14,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph>=1.0,<2.0",
    "markdownify>=0.13",
    "mcp>=1.27.1,<3",
    "pyyaml>=6.0",
    # wcmatch dipakai top-level oleh backends/cloud_storage_base.py dan
    # middleware/filesystem_guard.py — tanpa ini ModuleNotFoundError.
    "wcmatch>=8.0",
]

keywords = ["oi", "agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/akankofik-dev/oi-harness"
Source = "https://github.com/akankofik-dev/oi-harness"
Issues = "https://github.com/akankofik-dev/oi-harness/issues"

[project.optional-dependencies]
acp = ["agent-client-protocol>=0.9.0", "psutil>=5.9"]
all = [
    "agent-client-protocol>=0.9.0",
    "cos-python-sdk-v5>=1.9",
    "deepagents-backends>=0.2",
    "docker>=7.0",
    "esdk-obs-python>=3.24",
    "google-api-python-client>=2.0",
    "langchain-aws>=0.2",
    "langchain-community>=0.3",
    "langchain-tavily>=0.1",
    "langfuse>=4.9.0",
    "mss>=9.0",
    "oss2>=2.18",
    "pillow>=10.0",
    "psutil>=5.9",
    "psycopg[binary]>=3.2",
    "pynput>=1.7",
]
bedrock = ["langchain-aws>=0.2"]
cli = ["click>=8.1", "prompt-toolkit>=3.0", "python-dotenv>=1.0", "rich>=13.0"]
desktop = ["mss>=9.0", "pillow>=10.0", "pynput>=1.7"]
docker = ["docker>=7.0"]
object-storage = ["cos-python-sdk-v5>=1.9", "esdk-obs-python>=3.24", "oss2>=2.18"]
observability = ["langfuse>=4.9.0"]
opensandbox = ["opensandbox>=0.1.16,<1.2"]
remote-backends = ["deepagents-backends>=0.2", "psycopg[binary]>=3.2"]
web-search-all = [
    "google-api-python-client>=2.0",
    "langchain-community>=0.3",
    "langchain-tavily>=0.1",
]

[project.scripts]
oi-harness = "oi_harness.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["oi_harness"]

[tool.hatch.build.targets.sdist]
include = ["oi_harness"]